<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; gap: 60px; }
  .pair { display: flex; gap: 30px; align-items: flex-start; }
  .card { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .card img { width: 600px; height: 600px; object-fit: cover; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
  .label { color: #555; font: 10px/1 Helvetica; letter-spacing: 3px; text-transform: uppercase; }
  .title { color: #fff; font: 600 13px/1 Helvetica; letter-spacing: 2px; text-align: center; }
  .section { display: flex; flex-direction: column; align-items: center; gap: 16px; }
</style>
</head>
<body>

<div class="section">
  <div class="title">DISEÑO 1 — FRENTE</div>
  <img src="flyer1_front.jpg" style="width:700px;height:700px;object-fit:cover;box-shadow:0 20px 60px rgba(0,0,0,0.8)">
</div>

<div class="section">
  <div class="title">DISEÑO 1 — REVERSO</div>
  <img src="flyer1_back.jpg" style="width:700px;height:700px;object-fit:cover;box-shadow:0 20px 60px rgba(0,0,0,0.8)">
</div>

</body>
</html>
