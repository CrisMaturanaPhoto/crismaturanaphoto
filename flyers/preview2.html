<!DOCTYPE html>

<style>

  .card { text-align: center; }
  .card img { width: 500px; height: 500px; object-fit: cover; display: block; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
  .card p { font-size: 10px; color: #555; margin-top: 10px; letter-spacing: 2px; text-transform: uppercase; }
