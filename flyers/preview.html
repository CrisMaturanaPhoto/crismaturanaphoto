<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Flyers Preview</title>
<style>
  body { background: #111; margin: 0; padding: 30px; font-family: Helvetica, sans-serif; color: #fff; }
  h1 { text-align: center; color: #d4af37; letter-spacing: 3px; font-size: 14px; margin-bottom: 40px; }
  .section { margin-bottom: 60px; }
  .section h2 { color: #d4af37; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px; border-left: 3px solid #d4af37; padding-left: 10px; }
  .row { display: flex; gap: 20px; align-items: flex-start; }
  .card { text-align: center; }
  .card img { width: 500px; height: 500px; object-fit: cover; display: block; box-shadow: 0 8px 40px rgba(0,0,0,0.6); }
  .card p { font-size: 11px; color: #888; margin-top: 8px; letter-spacing: 1px; }
</style>
</head>
<body>
<h1>✦ PHOTO TOURS HOI AN — FLYER DESIGNS ✦</h1>

<div class="section">
  <h2>Diseño 1 — Full bleed · Overlay dorado</h2>
  <div class="row">
    <div class="card"><img src="flyer1_front.jpg"><p>FRENTE</p></div>
    <div class="card"><img src="flyer1_back.jpg"><p>REVERSO</p></div>
  </div>
</div>

<div class="section">
  <h2>Diseño 2 — Azul rey · Marco dorado</h2>
  <div class="row">
    <div class="card"><img src="flyer2_front.jpg"><p>FRENTE</p></div>
    <div class="card"><img src="flyer2_back.jpg"><p>REVERSO</p></div>
  </div>
</div>

<div class="section">
  <h2>Diseño 3 — Split layout · Minimalista oscuro</h2>
  <div class="row">
    <div class="card"><img src="flyer3_front.jpg"><p>FRENTE</p></div>
    <div class="card"><img src="flyer3_back.jpg"><p>REVERSO</p></div>
  </div>
</div>
</body>
</html>
